<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TornaDices">
  <!-- Icône du site : la tornade du logo, à fond perdu. Pas de coins arrondis
       ici — iOS et Android découpent eux-mêmes la silhouette, et une icône déjà
       arrondie s'y retrouverait rognée deux fois. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc0f5"/>
      <stop offset="1" stop-color="#1e83cc"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#ciel)"/>
  <circle cx="50" cy="49" r="35" fill="#fff"/>
  <circle cx="50" cy="49" r="30" fill="#a8dcf2"/>
  <g transform="translate(50 49) scale(.72) translate(-50 -50)"
     fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round">
    <ellipse cx="50" cy="29" rx="23" ry="9"/>
    <path d="M28 35.5c6 6.2 20.5 8.4 34.5 5.8"/>
    <path d="M32 47c6.4 5.6 18.6 7.3 29.4 4.9"/>
    <path d="M37 58.5c5.2 4.3 13.5 5.4 19.6 3.4"/>
    <path d="M44 69.5c1.5 5 5.6 7.8 10.3 6.4"/>
  </g>
</svg>
