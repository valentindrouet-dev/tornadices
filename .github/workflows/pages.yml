name: Déploiement GitHub Pages

# Le site est statique : on publie le dépôt tel quel, sans compilation.
# À activer une fois dans Settings → Pages → Source : GitHub Actions.

on:
  push:
    branches:
      - claude/tornadices-game-table-5spoxv
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifications du moteur et des probabilités
        run: node tests/moteur.test.js

  deployer:
    needs: verifier
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empêcher Jekyll de filtrer les fichiers
        run: touch .nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
